<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 262" width="800" height="262" role="img" aria-labelledby="t d">
<title id="t">Binary search</title>
<desc id="d">Two steps of binary search for 15 in a sorted array. The first mid is 11, so the left half is discarded; the next mid is 17.</desc>
<defs>
