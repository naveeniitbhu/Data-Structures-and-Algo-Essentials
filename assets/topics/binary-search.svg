<text x="592.0" y="208" class="mono t" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="600">mid</text>
<text x="696.0" y="208" class="mono t" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="600">hi</text>
