<text x="420" y="70" class="sans t" font-size="16" text-anchor="start" dominant-baseline="central" font-weight="700">Fill the table once, reuse every answer</text>
<text x="420" y="108" class="mono t" font-size="14" text-anchor="start" dominant-baseline="central">dp[i][j] = dp[i−1][j] + dp[i][j−1]</text>
