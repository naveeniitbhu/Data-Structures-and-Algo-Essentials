<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 206" width="800" height="206" role="img" aria-labelledby="t d">
<title id="t">Sliding window</title>
<desc id="d">A window of size 3 over an array. The next step drops the leftmost value and adds the next one, so the sum updates in O(1).</desc>
<defs>
<style>
.bg{fill:#F6F8FA;stroke:#D0D7DE}
.ink{stroke:#1F2328}
.fk{fill:#1F2328}
.cell{fill:#FFFFFF}
.sep{stroke:#D0D7DE}
.t{fill:#1F2328}
.m{fill:#59636E}
.on{fill:#1F2328}
.sans{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
.a1{fill:#9DB1FF}
.a2{fill:#FFA48C}
.a3{fill:#FFD36E}
.a4{fill:#CDAEFF}
.dim{opacity:.28}
@media (prefers-color-scheme:dark){
.bg{fill:#161B22;stroke:#30363D}
.ink{stroke:#E6EDF3}
.fk{fill:#E6EDF3}
.cell{fill:#0D1117}
.sep{stroke:#30363D}
.t{fill:#E6EDF3}
.m{fill:#9198A1}
}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,1 L10,5 L0,9 Z" class="fk"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="2" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,1 L0,5 L10,9 Z" class="fk"/></marker>
</defs>
<rect x="1" y="1" width="798" height="204" rx="16" class="bg" stroke-width="1.5"/>
<g>
<rect x="148" y="64" width="56" height="52" rx="0" class="cell ink" stroke-width="2"/>
<text x="176.0" y="90.0" class="mono t" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="600">2</text>
</g>
<g>
<rect x="204" y="64" width="56" height="52" rx="0" class="cell ink" stroke-width="2"/>
<text x="232.0" y="90.0" class="mono t" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="600">1</text>
</g>
<g>
<rect x="260" y="64" width="56" height="52" rx="0" class="a1 ink" stroke-width="2"/>
<text x="288.0" y="90.0" class="mono on" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="600">5</text>
</g>
<g>
<rect x="316" y="64" width="56" height="52" rx="0" class="a1 ink" stroke-width="2"/>
<text x="344.0" y="90.0" class="mono on" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="600">1</text>
</g>
<g>
<rect x="372" y="64" width="56" height="52" rx="0" class="a1 ink" stroke-width="2"/>
<text x="400.0" y="90.0" class="mono on" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="600">3</text>
</g>
<g>
<rect x="428" y="64" width="56" height="52" rx="0" class="a3 ink" stroke-width="2"/>
<text x="456.0" y="90.0" class="mono on" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="600">2</text>
</g>
<g>
<rect x="484" y="64" width="56" height="52" rx="0" class="cell ink" stroke-width="2"/>
<text x="512.0" y="90.0" class="mono t" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="600">7</text>
</g>
<g>
<rect x="540" y="64" width="56" height="52" rx="0" class="cell ink" stroke-width="2"/>
<text x="568.0" y="90.0" class="mono t" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="600">1</text>
</g>
<g>
<rect x="596" y="64" width="56" height="52" rx="0" class="cell ink" stroke-width="2"/>
<text x="624.0" y="90.0" class="mono t" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="600">4</text>
</g>
<rect x="148" y="64" width="504" height="52" rx="6" fill="none" class="ink" stroke-width="2"/>
<path d="M263,54 V44 H425 V54" fill="none" class="ink" stroke-width="2" stroke-linecap="round"/>
<text x="344.0" y="28" class="sans t" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="600">window, k = 3</text>
<line x1="440" y1="44" x2="488" y2="44" class="ink" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="498" y="44" class="sans m" font-size="14" text-anchor="start" dominant-baseline="central">slide</text>
<rect x="264.0" y="134" width="48.0" height="24" rx="12" class="a2 ink" stroke-width="1.5"/>
<text x="288.0" y="146" class="sans on" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="600">out</text>
<rect x="436.3" y="134" width="39.4" height="24" rx="12" class="a3 ink" stroke-width="1.5"/>
<text x="456.0" y="146" class="sans on" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="600">in</text>
<line x1="288.0" y1="132" x2="288.0" y2="122" class="ink" stroke-width="1.5" stroke-linecap="round"/>
<line x1="456.0" y1="132" x2="456.0" y2="122" class="ink" stroke-width="1.5" stroke-linecap="round"/>
<text x="400" y="184" class="mono m" font-size="14" text-anchor="middle" dominant-baseline="central">sum 5 + 1 + 3 = 9  →  9 − 5 + 2 = 6</text>
</svg>
