<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 276" width="800" height="276" role="img" aria-labelledby="t d">
<title id="t">Recursion and backtracking</title>
<desc id="d">Decision tree for subsets of [1, 2]: at each level take or skip one element; the four leaves are the subsets.</desc>
<defs>
<style>
.bg{fill:#F6F8FA;stroke:#D0D7DE}
.ink{stroke:#1F2328}
.fk{fill:#1F2328}
.cell{fill:#FFFFFF}
.sep{stroke:#D0D7DE}
.t{fill:#1F2328}
.m{fill:#59636E}
.on{fill:#1F2328}
.sans{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
.a1{fill:#9DB1FF}
.a2{fill:#FFA48C}
.a3{fill:#FFD36E}
.a4{fill:#CDAEFF}
.dim{opacity:.28}
@media (prefers-color-scheme:dark){
.bg{fill:#161B22;stroke:#30363D}
.ink{stroke:#E6EDF3}
.fk{fill:#E6EDF3}
.cell{fill:#0D1117}
.sep{stroke:#30363D}
.t{fill:#E6EDF3}
.m{fill:#9198A1}
}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,1 L10,5 L0,9 Z" class="fk"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="2" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,1 L0,5 L10,9 Z" class="fk"/></marker>
</defs>
<rect x="1" y="1" width="798" height="274" rx="16" class="bg" stroke-width="1.5"/>
<line x1="400" y1="69" x2="230" y2="113" class="ink" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="301.0" y="82.0" class="sans m" font-size="13" text-anchor="end" dominant-baseline="central">take 1</text>
<line x1="400" y1="69" x2="570" y2="113" class="ink" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="499.0" y="82.0" class="sans m" font-size="13" text-anchor="start" dominant-baseline="central">skip 1</text>
<line x1="230" y1="149" x2="145" y2="193" class="ink" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="173.5" y="162.0" class="sans m" font-size="13" text-anchor="end" dominant-baseline="central">take 2</text>
<line x1="230" y1="149" x2="315" y2="193" class="ink" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="286.5" y="162.0" class="sans m" font-size="13" text-anchor="start" dominant-baseline="central">skip 2</text>
<line x1="570" y1="149" x2="485" y2="193" class="ink" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="513.5" y="162.0" class="sans m" font-size="13" text-anchor="end" dominant-baseline="central">take 2</text>
<line x1="570" y1="149" x2="655" y2="193" class="ink" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="626.5" y="162.0" class="sans m" font-size="13" text-anchor="start" dominant-baseline="central">skip 2</text>
<rect x="370.0" y="35" width="60" height="34" rx="10" class="cell ink" stroke-width="2"/>
<text x="400" y="52" class="mono t" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="600">[ ]</text>
<rect x="200.0" y="115" width="60" height="34" rx="10" class="cell ink" stroke-width="2"/>
<text x="230" y="132" class="mono t" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="600">[1]</text>
<rect x="540.0" y="115" width="60" height="34" rx="10" class="cell ink" stroke-width="2"/>
<text x="570" y="132" class="mono t" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="600">[ ]</text>
<rect x="107.0" y="195" width="76" height="34" rx="10" class="a3 ink" stroke-width="2"/>
<text x="145" y="212" class="mono on" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="600">[1,2]</text>
<rect x="285.0" y="195" width="60" height="34" rx="10" class="a3 ink" stroke-width="2"/>
<text x="315" y="212" class="mono on" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="600">[1]</text>
<rect x="455.0" y="195" width="60" height="34" rx="10" class="a3 ink" stroke-width="2"/>
<text x="485" y="212" class="mono on" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="600">[2]</text>
<rect x="625.0" y="195" width="60" height="34" rx="10" class="a3 ink" stroke-width="2"/>
<text x="655" y="212" class="mono on" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="600">[ ]</text>
<text x="28" y="34" class="mono m" font-size="14" text-anchor="start" dominant-baseline="central">subsets([1, 2])</text>
<text x="400" y="254" class="sans m" font-size="13" text-anchor="middle" dominant-baseline="central">each leaf is one answer: take or skip every element, then backtrack</text>
</svg>
