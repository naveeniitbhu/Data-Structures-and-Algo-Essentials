<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 224" width="800" height="224" role="img" aria-labelledby="t d">
<title id="t">Sorting</title>
<desc id="d">Unsorted bars with two out-of-order neighbours being swapped, then the same bars in ascending order.</desc>
<defs>
<style>
.bg{fill:#F6F8FA;stroke:#D0D7DE}
.ink{stroke:#1F2328}
.fk{fill:#1F2328}
.cell{fill:#FFFFFF}
.sep{stroke:#D0D7DE}
.t{fill:#1F2328}
.m{fill:#59636E}
.on{fill:#1F2328}
.sans{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
.a1{fill:#9DB1FF}
.a2{fill:#FFA48C}
.a3{fill:#FFD36E}
.a4{fill:#CDAEFF}
.dim{opacity:.28}
@media (prefers-color-scheme:dark){
.bg{fill:#161B22;stroke:#30363D}
.ink{stroke:#E6EDF3}
.fk{fill:#E6EDF3}
.cell{fill:#0D1117}
.sep{stroke:#30363D}
.t{fill:#E6EDF3}
.m{fill:#9198A1}
}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,1 L10,5 L0,9 Z" class="fk"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="2" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,1 L0,5 L10,9 Z" class="fk"/></marker>
</defs>
<rect x="1" y="1" width="798" height="222" rx="16" class="bg" stroke-width="1.5"/>
<rect x="74" y="86" width="36" height="90" rx="5" class="cell ink" stroke-width="2"/>
<rect x="122" y="116" width="36" height="60" rx="5" class="cell ink" stroke-width="2"/>
<rect x="170" y="46" width="36" height="130" rx="5" class="cell ink" stroke-width="2"/>
<rect x="218" y="66" width="36" height="110" rx="5" class="a2 ink" stroke-width="2"/>
<rect x="266" y="106" width="36" height="70" rx="5" class="a2 ink" stroke-width="2"/>
<rect x="314" y="136" width="36" height="40" rx="5" class="cell ink" stroke-width="2"/>
<path d="M236.0,58 C236.0,36 284.0,36 284.0,96" fill="none" class="ink" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#as)"/>
<text x="310.0" y="48" class="sans m" font-size="14" text-anchor="start" dominant-baseline="central">swap</text>
<line x1="372" y1="116" x2="428" y2="116" class="ink" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="400" y="96" class="sans m" font-size="14" text-anchor="middle" dominant-baseline="central">sort</text>
<rect x="452" y="136" width="36" height="40" rx="5" class="a1 ink" stroke-width="2"/>
<rect x="500" y="116" width="36" height="60" rx="5" class="a1 ink" stroke-width="2"/>
<rect x="548" y="106" width="36" height="70" rx="5" class="a1 ink" stroke-width="2"/>
<rect x="596" y="86" width="36" height="90" rx="5" class="a1 ink" stroke-width="2"/>
<rect x="644" y="66" width="36" height="110" rx="5" class="a1 ink" stroke-width="2"/>
<rect x="692" y="46" width="36" height="130" rx="5" class="a1 ink" stroke-width="2"/>
<text x="212" y="202" class="sans m" font-size="14" text-anchor="middle" dominant-baseline="central">compare, then swap</text>
<text x="590" y="202" class="sans m" font-size="14" text-anchor="middle" dominant-baseline="central">ascending order</text>
</svg>
